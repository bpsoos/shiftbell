services:
  dev-permissions:
    image: ${DEV_IMAGE}
    user: "0:0"
    volumes:
      - "go_build_cache:/cache/go-build"
      - "go_module_cache:/go/pkg/mod"
      - "appdata:/data"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R ${LOCAL_UID:-1000}:${LOCAL_GID:-1000} /cache/go-build /go/pkg/mod /data"]

  shiftbell:
    build: .
    image: ${DEV_IMAGE}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      dev-seed:
        condition: service_completed_successfully
    ports:
      - "8080:80"
    environment:
      HOME: /tmp
      GOCACHE: /cache/go-build
      DATABASE_FILEPATH: "/data/app.db"
      LOG_FORMAT: "text"
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Budapest}"
      TZ: "${APP_TIMEZONE:-Europe/Budapest}"
    volumes:
      - "./:/src"
      - "go_build_cache:/cache/go-build"
      - "go_module_cache:/go/pkg/mod"
      - "appdata:/data"
    entrypoint: ["go"]
    command: ["tool", "air"]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --header='Accept: application/vnd.shiftbell+json' http://localhost/"]
      interval: 1s
      timeout: 1s
      retries: 60

  dev-seed:
    image: ${DEV_IMAGE}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      GOCACHE: /cache/go-build
      DATABASE_FILEPATH: /data/app.db
      DEMO_DATA_FILEPATH: /src/dev/demo/data.json
      LOG_FORMAT: text
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Budapest}"
      TZ: "${APP_TIMEZONE:-Europe/Budapest}"
    volumes:
      - "./:/src"
      - "go_build_cache:/cache/go-build"
      - "go_module_cache:/go/pkg/mod"
      - "appdata:/data"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        go tool templ generate
        go run ./cmd/populate-demo
    depends_on:
      dev-permissions:
        condition: service_completed_successfully

volumes:
  go_build_cache:
  go_module_cache:
  appdata:
